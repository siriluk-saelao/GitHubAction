name: Check Syntax

on:
  push:
    branches-ignore:
      - main

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # จำเป็นต้องดึง History ทั้งหมดเพื่อเปรียบเทียบ diff กับ main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linters
        run: npm install -g htmlhint jshint stylelint stylelint-config-standard

      # 1. ตรวจเฉพาะไฟล์ HTML ที่แก้ไข
      - name: Check HTML (Changed files only)
        run: |
          HTML_FILES=$(git diff --name-only origin/main...HEAD | grep '\.html$' || true)
          if [ -n "$HTML_FILES" ]; then
            echo "Found changed HTML files:"
            echo "$HTML_FILES"
            htmlhint $HTML_FILES
          else
            echo "No changed HTML files to check."
          fi

      # 2. ตรวจเฉพาะไฟล์ JS ที่แก้ไข
      - name: Check JS (Changed files only)
        run: |
          JS_FILES=$(git diff --name-only origin/main...HEAD | grep '\.js$' || true)
          if [ -n "$JS_FILES" ]; then
            echo "Found changed JS files:"
            echo "$JS_FILES"
            jshint --config '{"esversion": 6}' $JS_FILES
          else
            echo "No changed JS files to check."
          fi

      # 3. ตรวจเฉพาะไฟล์ CSS ที่แก้ไข
      - name: Check CSS (Changed files only)
        run: |
          CSS_FILES=$(git diff --name-only origin/main...HEAD | grep '\.css$' || true)
          if [ -n "$CSS_FILES" ]; then
            echo "Found changed CSS files:"
            echo "$CSS_FILES"
            npx stylelint $CSS_FILES --config '{"extends": "stylelint-config-standard"}'
          else
            echo "No changed CSS files to check."
          fi