name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main

jobs:
  # Job 1: ตรวจสอบ Syntax ของ HTML, JS และ CSS
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. ติดตั้ง Tool สำหรับตรวจ HTML, JS, CSS
      - name: Install Linters (HTML, JS, CSS)
        run: npm install -g htmlhint jshint stylelint stylelint-config-standard

      # 2. รันตรวจ HTML (ถ้าไม่เจอไฟล์ .html จะ ข้าม ทันที)
      - name: Run HTML syntax check
        run: |
          HTML_FILES=$(find . -type f -name "*.html" -not -path "*/node_modules/*")
          if [ -n "$HTML_FILES" ]; then
            echo "Found HTML files, running HTMLHint..."
            htmlhint $HTML_FILES
          else
            echo "No HTML files found. Skipping..."
          fi

      # 3. รันตรวจ JavaScript (ถ้าไม่เจอไฟล์ .js จะ ข้าม ทันที)
      - name: Run JS syntax check
        run: |
          JS_FILES=$(find . -type f -name "*.js" -not -path "*/node_modules/*")
          if [ -n "$JS_FILES" ]; then
            echo "Found JS files, running JSHint..."
            jshint --esversion=6 $JS_FILES
          else
            echo "No JS files found. Skipping..."
          fi

      # 4. รันตรวจ CSS (Stylelint มี --allow-empty-input ช่วยข้ามให้อยู่แล้ว)
      - name: Run CSS syntax check
        run: npx stylelint "**/*.css" --allow-empty-input --config '{"extends": "stylelint-config-standard"}'

  # Job 2: สร้าง PR ไปยัง main (จะรันเมื่อ check-syntax ผ่านทั้งหมดเท่านั้น)
  auto-create-pr:
    needs: check-syntax
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json number -q '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            COMMIT_MSG=$(git log -1 --format=%s)

            if [ -n "$COMMIT_MSG" ]; then
              PR_TITLE="$COMMIT_MSG"
            else
              PR_TITLE="คำขอ merge จาก branch ${{ github.ref_name }} เข้า main"
            fi

            echo "Creating PR with title: '$PR_TITLE'"

            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "$PR_TITLE" \
              --body "Automated PR created after syntax check passed successfully."
          else
            echo "PR already exists (#$EXISTING_PR) for branch '${{ github.ref_name }}'. Skipping creation."
          fi